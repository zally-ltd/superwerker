
name: Branch Deployments

on:
  push:
    branches: ['*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_AWS_CREDENTIALS: ${{ secrets.AWS_ACCESS_KEY != '' && secrets.AWS_SECRET_ACCESS_KEY != '' && secrets.AWS_BUCKET_NAME != '' }}

    steps:

    - name: Check branch deployment credentials
      if: env.HAS_AWS_CREDENTIALS != 'true'
      run: echo "::notice title=Branch deployment skipped::AWS_ACCESS_KEY, AWS_SECRET_ACCESS_KEY or AWS_BUCKET_NAME is not configured, so templates are not uploaded to S3."

    - name: Checkout
      uses: actions/checkout@v4

    - name: Branch name
      run: echo running on branch ${GITHUB_REF##*/}

    - name: Extract branch name
      shell: bash
      run: echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/})"
      id: extract_branch

    - name: Version the templates
      shell: bash
      run: scripts/versioning.sh ${{ steps.extract_branch.outputs.branch }}
      id: version_templates

    - uses: shallwefootball/s3-upload-action@master
      name: Upload S3
      id: S3
      if: env.HAS_AWS_CREDENTIALS == 'true'
      with:
        aws_key_id: ${{ secrets.AWS_ACCESS_KEY }}
        aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
        aws_bucket: ${{ secrets.AWS_BUCKET_NAME}}
        source_dir: templates/
        destination_dir: ${{ steps.extract_branch.outputs.branch }}/templates/
